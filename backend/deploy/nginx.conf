# nginx: принимает запросы из интернета и передаёт их API.
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/firesync
#   sudo ln -s /etc/nginx/sites-available/firesync /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.YOUR-DOMAIN        # HTTPS бесплатно

server {
    listen 80;
    server_name api.YOUR-DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # эталонный расчёт напарника идёт до ~30 секунд
        proxy_buffering off;       # CSV отдаётся потоком
    }
}
