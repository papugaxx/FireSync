# nginx: accepts requests from the internet and forwards them to the API.
# Installation:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/firesync
#   sudo ln -s /etc/nginx/sites-available/firesync /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.YOUR-DOMAIN        # free HTTPS

server {
    listen 80;
    server_name api.YOUR-DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # the partner's reference calculation takes up to ~30 seconds
        proxy_buffering off;       # CSV is streamed
    }
}
