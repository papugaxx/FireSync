# nginx: one domain for everything.
#   https://YOUR-DOMAIN/            → the website (Next.js, port 3000)
#   https://YOUR-DOMAIN/api/...     → the API the website calls (FastAPI, port 8000)
#   https://YOUR-DOMAIN/docs        → interactive API documentation
# Installed by deploy/setup_server.sh (YOUR-DOMAIN is replaced there). By hand:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/firesync
#   sudo ln -s /etc/nginx/sites-available/firesync /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR-DOMAIN        # free HTTPS

server {
    listen 80;
    server_name YOUR-DOMAIN;

    # The API: what the website calls
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # a whole-month CSV export can take a while
        proxy_buffering off;       # CSV is streamed
    }

    # The API documentation and its general endpoints (/calendar, /cells, /status, ...)
    location ~ ^/(docs|redoc|openapi\.json|health|status|regions|calendar|cells|points|harmonization|anomaly|export\.csv)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Everything else: the website
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
