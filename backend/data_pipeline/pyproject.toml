[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fires-data-pipeline"
version = "0.1.0"
description = "NASA FIRMS API ingestion and SQLite access for the hackathon application"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fires-data = "fires_data.cli:main"

[tool.setuptools.packages.find]
include = ["fires_data*"]

[tool.setuptools.package-data]
fires_data = ["schema.sql"]
