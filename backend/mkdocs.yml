site_name: FireSync
site_description: Documentation for the FireSync backend API, data pipeline and frontend
# Public address of the deployed docs (GitHub Pages: https://<github-user>.github.io/<repo>/).
# Change this if you host the docs somewhere else, or move the repository.
site_url: https://papugaxx.github.io/FireSync/
# Lets you also open site/index.html straight from disk (local use only)
use_directory_urls: false
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [., data_pipeline]
          options:
            show_if_no_docstring: true
            members_order: source
            show_root_heading: true
            show_source: false
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Grid and calendar: concepts/grid-and-calendar.md
      - Harmonization: concepts/harmonization.md
      - Architecture: concepts/architecture.md
  - HTTP API:
      - Overview: api/overview.md
      - Endpoints: api/endpoints.md
  - Data:
      - Archive import and NASA updates: pipeline/archive-and-updates.md
      - Partner pipeline command line: pipeline/cli.md
      - Partner pipeline data model: pipeline/data-model.md
  - Operations:
      - Configuration: operations/configuration.md
      - Deployment: operations/deployment.md
      - Troubleshooting: operations/troubleshooting.md
  - Development:
      - Testing: development/testing.md
      - Frontend: development/frontend.md
      - Writing documentation: development/documentation.md
  - API reference:
      - main: reference/main.md
      - frontend_api: reference/frontend_api.md
      - store: reference/store.md
      - reports: reference/reports.md
      - importer: reference/importer.md
      - updater: reference/updater.md
      - analytics: reference/analytics.md
      - config: reference/config.md
      - Data pipeline: reference/pipeline.md
