name: docs

# Builds the MkDocs site from backend/ and publishes it to GitHub Pages.
# One-time setup: GitHub -> Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "backend/docs/**"
      - "backend/mkdocs.yml"
      - "backend/requirements-docs.txt"
      - "backend/*.py"
      - "backend/data_pipeline/fires_data/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-docs.txt

      - name: Install documentation tools
        run: pip install -r requirements-docs.txt
        working-directory: backend

      # --strict turns broken links and unresolved references into errors.
      # mkdocs.yml lives in backend/, so the build must run from there.
      - name: Build site
        run: mkdocs build --strict
        working-directory: backend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: backend/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
